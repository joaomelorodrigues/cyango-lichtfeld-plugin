[project]
name = "cyango"
version = "0.1.0"
description = "Publish LichtFeld Studio splat scenes to Cyango"
authors = [{name = "Cyango"}]
requires-python = ">=3.10"

[tool.lichtfeld]
hot_reload = true
plugin_api = ">=1,<2"
lichtfeld_version = ">=0.5.3"
required_features = ["panels.v1", "settings.v1", "signals.v1"]
